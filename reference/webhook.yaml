  /{protocol}/{network}/webhooks/history:
    get:
      security:
        - api_key: []
      tags:
        - Webhook API
      description: |+
        Webhook의 Subscription ID로 Webhook 정보를 조회하기 위한 API입니다.


      summary: Get Webhook History
      operationId: getWebhookHistory
      parameters:
        - name: protocol
          in: path
          required: true
          schema:
            type: string
            enum:
              - aptos
            default: aptos
          description: 조회 대상 체인의 프로토콜을 지정하기 위한 파라미터입니다.
        - name: network
          in: path
          required: true
          schema:
            type: string
            default: mainnet
            enum:
              - mainnet
              - testnet
          description: |
            조회 대상 체인의 네트워크를 지정하기 위한 파라미터입니다. 프로토콜에 따라 지원되는 네트워크가 다를 수 있습니다.

            - aptos: "mainnet", "testnet"
            - arbitrum: "mainnet", "sepolia"
            - base: "mainnet", "sepolia",
            - ethereum: "mainnet", "sepolia", "holesky"
            - kaia: "mainnet", "kairos"
            - optimism: "mainnet", "sepolia"
            - polygon: "mainnet", "amoy"
            - luniverse(the balance): "mainnet"
        - name: subscriptionId
          in: query
          required: true
          schema:
            type: string
          description: >-
            조회하고자 하는 Webhook에 할당된 subscriptionId를 지정하기 위한 파라미터입니다. Webhook 생성 시
            반환되는 subscriptionId를 사용하여 Webhook 정보를 조회, 수정 및 삭제할 수 있습니다. 빈 값을 입력하면
            모든 Webhook 정보를 조회합니다.
        - name: page
          in: query
          required: false
          schema:
            type: string
          description: 조회할 페이지를 지정합니다. 기본값은 1입니다.
        - name: rpp
          in: query
          required: false
          schema:
            type: string
          description: 한 페이지에 조회할 이벤트 수를 지정합니다. 값의 범위는 1에서 100입니다. 기본값은 10입니다.
        - name: withEventMessage
          in: query
          required: false
          schema:
            type: boolean
          description: 이벤트 메시지를 함께 조회할지 여부를 지정합니다. 기본값은 false입니다.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - SUCCESS
              - FAIL
          description: 웹훅 호출의 성공(SUCCESS) 또는 실패(FAIL) 여부를 기준으로 이벤트를 필터링합니다.
        - name: startAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 조회할 이벤트 발생의 시작 시각을 ISO 8601 형식으로 지정합니다.
        - name: endAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 조회할 이벤트 발생의 종료 시각을 ISO 8601 형식으로 지정합니다.
        - name: startSequenceNumber
          in: query
          required: false
          schema:
            type: string
          description: 조회를 시작할 sequenceNumber를 지정합니다.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: 조건에 맞는 총 이벤트 개수입니다.
                  page:
                    type: number
                    description: 현재 조회된 페이지 번호입니다.
                  rpp:
                    type: number
                    description: 요청에 따라 반환된 한 페이지당 이벤트 수입니다.
                  items:
                    type: array
                    description: 이벤트 상세 데이터를 포함하는 배열입니다.
                    items:
                      type: object
                      properties:
                        subscriptionId:
                          type: string
                          description: >-
                            Webhook에 할당된 subscriptionId를 나타내는 필드입니다.
                            subscriptionId는 Webhook을 식별하는 유니크한 값으로, Webhook을 조회,
                            수정 또는 삭제할 때 사용됩니다.
                        description:
                          type: string
                          description: Webhook의 설명을 나타내는 필드입니다.
                        protocol:
                          type: string
                          description: >-
                            해당 Webhook의 프로토콜을 나타내는 필드입니다. (e.g., ETHEREUM,
                            POLYGON, OPTIMISM, ...)
                        network:
                          type: string
                          description: >-
                            해당 Webhook의 네트워크를 나타내는 필드입니다. (e.g., MAINNET,
                            SEPOLIA, MUMBAI, ...)
                        subscriptionType:
                          type: string
                          description: 구독 유형을 식별할 수 있는 필드입니다.
                          example: WEBHOOK
                        eventType:
                          type: string
                          description: 해당 Webhook이 구독하는 이벤트 타입을 나타내는 필드입니다.
                        notification:
                          type: object
                          required:
                            - webhookUrl
                          description: Webhook으로 알림을 받기 위한 정보를 나타내는 필드입니다.
                          properties:
                            webhookUrl:
                              type: string
                              description: Webhook으로 알림을 받을 URL을 나타내는 필드입니다.
                        isActive:
                          type: boolean
                          description: >-
                            Webhook의 활성화 여부를 나타내는 필드입니다. Webhook이 활성화되어 있으면
                            true, 비활성화되어 있으면 false입니다. Webhook이 비활성화되어 있으면 해당
                            Webhook으로 알림을 받을 수 없습니다.
                        updatedAt:
                          type: string
                          description: Webhook이 수정된 시간을 나타내는 필드입니다. ISO 8601 형식으로 표현됩니다.
                        createdAt:
                          type: string
                          description: Webhook이 생성된 시간을 나타내는 필드입니다. ISO 8601 형식으로 표현됩니다.
                        condition:
                          type: object
                          description: >-
                            Webhook 구독 조건을 나타내는 필드입니다. 이벤트 타입에 따라 다른 조건을 가질 수
                            있습니다.
              example:
                total: 146779
                rpp: 2
                page: 1
                items:
                  - id: '1596'
                    subscriptionId: '103524'
                    sequenceNumber: '20'
                    status: FAIL
