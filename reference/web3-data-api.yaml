          description: >
            트론 네트워크에서 제공하는 탈중앙화 거래소(DEX)의 교환 거래(Swap)를 식별하는 고유 ID입니다. 이 ID를 통해
            특정 교환 트랜잭션을 구분하고, 어떤 자산 페어에서 거래가 이루어졌는지 추적할 수 있습니다. 교환 거래로 인한 전송이 아닌
