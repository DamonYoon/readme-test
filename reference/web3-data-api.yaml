        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokens
              properties:
                tokens:
                  type: array
                  items:
                    type: object
                    required:
                      - contractAddress
                      - tokenId
                    properties:
                      contractAddress:
                        $ref: '#/components/schemas/EvmNftContractAddressParameter'
                      tokenId:
                        $ref: '#/components/schemas/EvmNftTokenIdParameter'
                    examples:
                      - contractAddress: '0x1a9c8182c09f50c8318d769245bea529a223e992'
