components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: >-
        The default value, `nodit-demo`, is only for use in the developer
        documentation. For real applications or services, use the API key
        obtained from the Nodit console.
  parameters:
    EvmChainParameter:
      name: chain
      in: path
      required: true
      schema:
        type: string
        description: |
          조회할 체인을 지정하는 파라미터입니다. API에 따라 지원되는 체인이 다를 수 있습니다.
        enum:
          - arbitrum
          - base
          - chiliz
          - ethereum
          - ethereumclassic
          - giwa
          - kaia
          - optimism
          - polygon
          - luniverse
        default: ethereum
    EvmNetworkParameter:
      name: network
      in: path
      required: true
      schema:
        type: string
        description: |
          조회할 네트워크를 지정하는 파라미터입니다. API에 따라 지원되는 네트워크가 다를 수 있습니다.
          - `arbitrum`: mainnet, sepolia
          - `base`: mainnet, sepolia
          - `chiliz`: mainnet
          - `ethereum`: mainnet, sepolia, hoodi
          - `ethereumclassic`: mainnet
          - `giwa`: sepolia
          - `kaia`: mainnet, kairos
          - `optimism`: mainnet, sepolia
          - `polygon`: mainnet, amoy
          - `luniverse`: mainnet
        enum:
          - mainnet
          - sepolia
          - hoodi
          - amoy
          - kairos
        default: mainnet
    AptosChainParameter:
      name: chain
      in: path
      required: true
      schema:
        type: string
        description: |
          조회할 체인을 지정하는 파라미터입니다. API에 따라 지원되는 체인이 다를 수 있습니다.
        enum:
          - aptos
        default: aptos
    AptosNetworkParameter:
      name: network
      in: path
      required: true
      schema:
        type: string
        description: |
          조회할 네트워크를 지정하는 파라미터입니다. API에 따라 지원되는 네트워크가 다를 수 있습니다.
        enum:
          - mainnet
        default: mainnet
    EvmTronChainParameter:
      name: chain
      in: path
      required: true
      schema:
        type: string
        description: |
          조회할 체인을 지정하는 파라미터입니다. API에 따라 지원되는 체인이 다를 수 있습니다.
        enum:
          - arbitrum
          - base
          - chiliz
          - ethereum
          - ethereumclassic
          - giwa
          - kaia
          - optimism
          - polygon
          - luniverse
          - tron
        default: ethereum
    EvmTronNetworkParameter:
      name: network
      in: path
      required: true
      schema:
        type: string
        description: |
          조회할 네트워크를 지정하는 파라미터입니다. API에 따라 지원되는 네트워크가 다를 수 있습니다.
          - `arbitrum`: mainnet, sepolia
          - `base`: mainnet, sepolia
          - `chiliz`: mainnet
          - `ethereum`: mainnet, sepolia, hoodi
          - `ethereumclassic`: mainnet
          - `giwa`: sepolia
          - `kaia`: mainnet, kairos
          - `optimism`: mainnet, sepolia
          - `polygon`: mainnet, amoy
