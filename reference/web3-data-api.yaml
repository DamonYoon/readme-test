                      - contractAddress: '0x1a9c8182c09f50c8318d769245bea529a223e992'
                        tokenId: '2'
                      - contractAddress: '0x1a9c8182c09f50c8318d769245bea529a223e992'
                        tokenId: '3'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 동기화 요청에 대한 결과 메시지를 반환합니다.
