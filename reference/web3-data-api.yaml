  /{chain}/{network}/token/getTokensOwnedByAccount:
    post:
      security:
        - api_key: []
      tags:
        - Token API
      description: >
        특정 Account가 보유한 토큰의 목록을 조회합니다. 조회 결과에는 각 토큰의 보유 수량과 토큰 컨트랙트의 메타데이터가
        포함됩니다.
      summary: Get Tokens Owned By Account
      operationId: getTokensOwnedByAccount
      parameters:
        - $ref: '#/components/parameters/EvmTronAptosChainParameter'
        - $ref: '#/components/parameters/EvmTronAptosNetworkParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Evm (Ethereum, Optimism, ...)
                  allOf:
                    - type: object
                      required:
                        - accountAddress
                      properties:
                        accountAddress:
                          $ref: '#/components/schemas/EvmAccountAddressParameter'
                        contractAddresses:
                          $ref: >-
                            #/components/schemas/EvmTokenContractAddressesParameter
                    - $ref: '#/components/schemas/PaginationParameter'
                  default:
                    accountAddress: '0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045'
                    contractAddresses:
                      - '0xdAC17F958D2ee523a2206206994597C13D831ec7'
                - title: Tron
                  allOf:
                    - type: object
                      required:
                        - accountAddress
                      properties:
                        accountAddress:
                          $ref: '#/components/schemas/TronAccountAddressParameter'
                        contractAddresses:
                          $ref: >-
                            #/components/schemas/TronTokenContractAddressesParameter
                    - $ref: '#/components/schemas/PaginationParameter'
                  default:
                    accountAddress: TT2T17KZhoDu47i2E4FWxfG79zdkEWkU9N
