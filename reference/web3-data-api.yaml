        - 이 필드는 fromBlock, toBlock과 함께 사용할 수 없습니다.
      pattern: >-
        ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$
      example: '2025-01-01T00:00:00+00:00'
    UtxoToDateParameter:
      type: string
      description: >
        조회 종료 날짜를 지정하는 파라미터입니다. 날짜는 ISO 8601 형식(YYYY-MM-DDThh:mm:ss{time zone})을
        따라야 하며, 초 단위까지 입력해야 합니다.


        <strong style="color: red;">*</strong> 유의사항:

        - fromDate 없이 toDate만 제공되면, earliest block 시점부터 toDate에 입력한 날짜까지의 결과가
        조회됩니다. earliest block는 체인마다 genesis block 또는 특정 시점(e.g. 하드포크 등)부터일 수
        있습니다.

        - toDate 값은 fromDate 값과 같거나 더 미래의 값을 가져야 합니다.

        - fromDate와 toDate에 동일한 값을 입력하면, 입력한 날짜에서 발생한 결과만 조회됩니다.

        - 이 필드는 fromBlock, toBlock과 함께 사용할 수 없습니다.
      pattern: >-
        ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$
      example: '2025-01-31T00:00:00+00:00'
    UtxoTokenTransfer:
      type: object
      required:
        - senders
        - recipients
        - fee
        - transactionHash
        - transactionId
        - blockHeight
        - blockHash
        - blockTimestamp
      properties:
        senders:
          type: array
          description: >
            트랜잭션에 포함된 각 송신자의 세부 정보를 포함한 배열입니다. 각 객체는 송신자의 주소, 송금 금액, 송신자의 인덱스를
            포함합니다.
          items:
            type: object
            required:
              - index
              - address
              - value
            properties:
              index:
                type: integer
                description: >
                  송신자의 인덱스로, 트랜잭션에서 송신자를 고유하게 식별합니다. 0부터 시작하며, 송신자가 여러 명일 경우
                  순차적으로 부여됩니다.
              address:
                type: string
                description: >
                  송신자의 주소입니다. 송신자가 트랜잭션에서 비트코인을 보내기 위해 사용하는 주소이며, P2PKH, P2SH,
                  Bech32, 또는 Bech32m 등의 형식을 따릅니다.
              value:
                type: string
                description: |
                  송신자가 트랜잭션에서 보낸 금액으로, BTC 단위로 표시됩니다. 금액은 소수점 8자리까지 허용됩니다.
        recipients:
          type: array
          description: >
            트랜잭션에 포함된 각 수신자의 세부 정보를 포함한 배열입니다. 각 객체는 수신자의 주소, 수령 금액, 수신자의 인덱스를
            포함합니다.
          items:
            type: object
            required:
              - index
              - address
              - value
            properties:
              index:
                type: integer
                description: >
                  수신자의 인덱스로, 트랜잭션에서 수신자를 고유하게 식별합니다. 0부터 시작하며, 수신자가 여러 명일 경우
                  순차적으로 부여됩니다.
              address:
                type: string
                description: >
                  수신자의 주소입니다. 수신자가 비트코인을 받기 위해 사용하는 주소이며, P2PKH, P2SH, Bech32,
                  또는 Bech32m 등의 형식을 따릅니다.
              value:
                type: string
                description: |
                  수신자가 트랜잭션에서 받은 금액으로, BTC 단위로 표시됩니다. 금액은 소수점 8자리까지 허용됩니다.
        fee:
          type: string
          description: >
            트랜잭션 수수료로, 송신자가 트랜잭션을 블록체인 네트워크에 포함시키기 위해 지불한 금액입니다. 금액은 BTC 단위로
            표시됩니다.
        transactionHash:
          type: string
          description: >
            트랜잭션의 고유 해시 값입니다. 트랜잭션 데이터를 기반으로 생성된 64자리 16진수 문자열로, 트랜잭션을 고유하게
            식별합니다.
        transactionId:
          type: string
          description: |
            트랜잭션의 고유 ID입니다. 각 트랜잭션을 고유하게 식별할 수 있는 값으로, 64자리 16진수 문자열로 나타납니다.
        blockHeight:
          type: integer
          description: |
            트랜잭션이 포함된 블록의 높이를 나타냅니다. 블록체인에서 순서를 나타내는 정수 값입니다.
        blockHash:
          type: string
          description: >
            트랜잭션이 포함된 블록의 고유 해시 값입니다. SHA-256 알고리즘을 기반으로 생성된 64자리 16진수 문자열로, 블록을
            고유하게 식별합니다.
        blockTimestamp:
          type: integer
          description: >
            트랜잭션이 포함된 블록의 생성 시간입니다. 값은 UNIX 타임스탬프 형식으로, 블록이 생성된 UTC 시간을 초 단위로
            나타냅니다.
    AptosBlockParameter:
      type: string
      description: >
        조회하고자 하는 블록을 지정하는 파라미터입니다. 이 파라미터의 기본 값은 latest이며, 블록 번호(10진수 문자열), 블록
        해시(0x로 시작하는 64자리 16진수 문자열) 또는 블록 태그(earliest, latest)를 입력할 수 있습니다.
        "earliest"는 첫 번째 블록을, "latest"는 최근 블록을 의미합니다.
      pattern: ^[0-9]+$|^0[xX][0-9a-fA-F]{64}|latest|earliest
      default: latest
      example: latest
    UtxoBlockParameter:
      type: string
      description: |
        잔고 조회 시점을 지정하는 파라미터입니다. 다음 형식 중 하나를 입력할 수 있습니다:
        - block hash: 64자리 16진수 문자열 (256비트). 해당 블록 해시를 기준으로 조회됩니다.
        - block number: 10진수 문자열. 해당 블록 높이를 기준으로 조회됩니다.
        - block tag: "earliest" 또는 "latest"를 입력하여 첫 번째 블록 또는 최신 블록을 조회합니다.
      pattern: ^[0-9]+$|^0[xX][0-9a-fA-F]{64}|latest|earliest
      default: latest
      example: latest
    KaiaBlockParameter:
      type: string
      description: >
        잔고 조회 시점을 지정하는 파라미터입니다. 다음 형식 중 하나를 입력할 수 있습니다:

        - block hash: "0x"로 시작하는 64자리 16진수 문자열. 해당 블록 해시를 기준으로 조회됩니다.

        - block number: 10진수 문자열. 해당 블록 높이를 기준으로 조회됩니다.

        - block tag: "earliest" 또는 "latest"를 입력하여 첫 번째 블록 또는 최신 블록을 조회합니다.
        (Kaia의 경우, "earliest"는 Kaia 하드포크 시점의 블록인 162,900,480을 의미합니다.)
      pattern: ^[0-9]+$|^0[xX][0-9a-fA-F]{64}|latest|earliest
      default: latest
      example: latest
    AptosBlock:
      type: object
      description: |
        Aptos 블록 정보입니다.
      required:
        - hash
        - height
        - timestamp
        - firstVersion
        - lastVersion
        - transactionsCount
        - transactions
      properties:
        hash:
          type: string
          description: >
            블록의 고유 식별 해시값을 나타내는 필드입니다.

            해당 블록의 모든 데이터를 포함하여 계산된 암호학적 해시값으로, 0x로 시작하는 64자리 16진수 문자열 형태로
            제공됩니다.

            블록의 무결성을 검증하고 블록을 고유하게 식별하는 데 사용됩니다.
        height:
          type: integer
          description: >
            블록의 높이를 나타내는 필드입니다.

            제네시스 블록(0)부터 시작하여 순차적으로 증가하는 정수값으로, 블록체인의 길이와 특정 블록의 위치를 나타내는 지표로
            사용됩니다.

            블록 높이는 체인 내에서 블록의 상대적 위치를 식별하고 블록 순서를 결정하는 데 사용됩니다.
        timestamp:
          type: integer
          description: |
            블록이 생성된 시간을 나타내는 필드입니다.
            마이크로초(microseconds) 단위의 UNIX 타임스탬프로 제공되며, 블록의 생성 순서와 시간 추적에 사용됩니다.
            블록 타임스탬프는 트랜잭션의 시간 순서를 보장하고 블록 생성 간격을 측정하는 데 활용됩니다.
        firstVersion:
          type: integer
          description: |
            블록에 포함된 트랜잭션들 중 가장 먼저 처리된 트랜잭션의 version 번호를 나타내는 필드입니다.
            Aptos에서 각 트랜잭션은 고유한 version 번호를 가지며, 이는 트랜잭션의 전체 실행 순서를 나타냅니다.
            firstVersion과 lastVersion을 통해 블록 내 트랜잭션들의 version 범위를 확인할 수 있습니다.
        lastVersion:
          type: integer
          description: >
            블록에 포함된 트랜잭션들 중 마지막으로 처리된 트랜잭션의 version 번호를 나타내는 필드입니다.

            firstVersion과 함께 블록 내 트랜잭션들의 version 범위를 정의하며, 이를 통해 블록 내 모든 트랜잭션을
            순차적으로 조회할 수 있습니다.
        transactionsCount:
          type: integer
          description: >
            블록에 포함된 총 트랜잭션의 개수를 나타내는 필드입니다.

            블록의 크기와 처리량을 이해하는 데 중요한 지표가 되며, 블록 내 모든 유형의 트랜잭션(사용자 트랜잭션, 시스템 트랜잭션
            등)을 포함합니다.

            이 값은 lastVersion - firstVersion + 1과 동일합니다.
        transactions:
          type: array
          description: >
            블록에 포함된 모든 트랜잭션의 version 번호 목록을 나타내는 필드입니다.

            각 version 번호는 해당 트랜잭션의 고유 식별자로 사용되며, firstVersion부터 lastVersion까지
            순차적으로 정렬되어 있습니다.

            이 목록을 통해 블록 내 개별 트랜잭션의 상세 정보를 조회할 수 있습니다.
          items:
            type: integer
            description: |
              각 트랜잭션의 version 번호를 나타내는 필드입니다.
    UtxoBlock:
      type: object
      required:
        - hash
        - height
        - version
        - timestamp
        - nonce
        - bits
        - difficulty
        - merkleRoot
        - transactionCount
        - size
        - weight
        - previousBlockHash
        - nextBlockHash
        - medianTime
        - strippedSize
        - transactions
      properties:
        hash:
          type: string
          description: >
            블록을 고유하게 식별하는 SHA-256 해시 값입니다. 블록 헤더의 정보를 조합하여 생성되며, 블록체인 내에서 중복되지
            않는 식별자입니다.
        height:
          type: integer
          description: |
            블록체인에서 블록의 위치를 나타내는 번호입니다. 제네시스 블록은 0번으로 시작하며, 이후 블록들은 1씩 증가합니다.
        version:
          type: integer
          description: >
            블록의 버전 번호로, 네트워크에서 사용되는 블록 검증 규칙을 식별하는 데 사용됩니다. 새로운 기능이 추가되면 버전이
            업데이트됩니다.
        timestamp:
          type: integer
          description: |
            블록 생성 시간을 나타내며, UNIX 타임스탬프로 표시됩니다.
        nonce:
          type: integer
          description: >
            작업증명(Proof-of-Work) 알고리즘에서 사용되는 값으로, 유효한 블록 해시를 찾기 위해 여러 번 변경되는
            변수입니다.
        bits:
          type: string
          description: >
            블록 해시가 만족해야 하는 난이도 목표 값으로, 압축된 32비트 16진수로 표현됩니다. 이 값은 네트워크의 채굴 난이도에
            따라 변합니다.
        difficulty:
          type: string
          description: >
            블록의 난이도를 나타내며, 초기 목표 값과 현재 목표 값의 비율로 계산됩니다. 이 값은 채굴의 상대적인 난이도를
            반영합니다.
        merkleRoot:
          type: string
          description: >
            블록에 포함된 모든 트랜잭션들의 해시를 조합하여 생성된 머클 루트 해시 값입니다. 이 값은 블록 검증 과정에서 블록 내용의
            무결성을 확인하는 데 사용됩니다.
        transactionCount:
          type: integer
          description: |
            블록에 포함된 트랜잭션의 개수를 나타내는 필드입니다.
        size:
          type: integer
          description: >
            블록의 전체 크기로, 헤더와 트랜잭션 데이터를 포함한 바이트 단위 값입니다. 이 값은 블록 데이터를 저장하는 데 필요한
            실제 디스크 공간을 나타냅니다.
        weight:
          type: integer
          description: |
            SegWit 데이터를 고려하여 BIP-141에 정의된 방식으로 계산된 블록의 가중치입니다.
        previousBlockHash:
          type: string
          description: |
            이전 블록의 해시 값으로, 블록체인 내에서 블록 간의 연결을 유지합니다. 제네시스 블록의 경우 이 값은 null입니다.
        nextBlockHash:
          type: string
          description: |
            다음 블록의 해시 값으로, 가장 최신 블록의 경우 이 값은 null입니다. 이는 체인의 끝을 나타냅니다.
        medianTime:
          type: integer
          description: |
            최근 11개의 블록 타임스탬프의 중간값입니다. 시간의 변동성을 줄이고 보다 안정적인 블록 시간을 제공하기 위해 사용됩니다.
        strippedSize:
          type: integer
          description: |
            SegWit 데이터를 제외한 블록의 크기입니다. 바이트 단위로 측정되며, 순수한 트랜잭션 데이터와 헤더 크기를 나타냅니다.
        transactions:
          type: array
          description: |
            블록에 포함된 트랜잭션의 해시 값 배열입니다. 각 트랜잭션은 고유한 해시 값으로 식별됩니다.
          items:
            type: string
            description: |
              각 트랜잭션을 고유하게 식별하는 SHA-256 해시 값입니다.
    BitcoincashAblastate:
      type: object
      description: >
        ABLA(Adaptive Block Limit Algorithm) 상태값입니다. ABLA 활성화 이후 블록에서만 제공될 수
        있으며, 제공되는 경우 내부 필드는 모두 존재합니다.
      required:
        - epsilon
        - beta
        - blockSize
        - blockSizeLimit
        - nextBlockSizeLimit
      properties:
        epsilon:
          type: integer
          description: >
            ABLA(Adaptive Block Limit Algorithm) 알고리즘의 엡실론 파라미터입니다. 블록 크기 조정의
            민감도를 제어하는 값입니다.
        beta:
          type: integer
          description: |
            ABLA 알고리즘의 베타 파라미터입니다. 블록 크기 증가율을 제한하는 감쇠 계수입니다.
        blockSize:
          type: integer
          description: |
            현재 블록의 실제 크기(바이트 단위)입니다. 블록에 포함된 트랜잭션 데이터의 총 크기를 나타냅니다.
        blockSizeLimit:
          type: integer
          description: |
            현재 블록에 적용되는 최대 크기 제한(바이트 단위)입니다. ABLA 알고리즘에 의해 동적으로 조정됩니다.
        nextBlockSizeLimit:
          type: integer
          description: |
            다음 블록에 적용될 예상 최대 크기 제한(바이트 단위)입니다. 현재 블록의 사용률을 기반으로 ABLA가 계산한 값입니다.
    EvmBlock:
      type: object
      description: |
        EVM 계열 블록 정보를 반환합니다.
      required:
        - hash
        - number
        - timestamp
        - parentHash
        - nonce
        - stateRoot
        - receiptsRoot
        - transactionsRoot
        - miner
        - difficulty
        - totalDifficulty
        - mixHash
        - gasLimit
        - gasUsed
        - size
        - logsBloom
        - extraData
        - sha3Uncles
        - transactionsCount
        - transactions
      properties:
        hash:
          type: string
          description: |
            블록 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로 제공됩니다.
        number:
          type: integer
          description: |
            블록 번호 또는 블록 높이를 나타내는 필드입니다. 10진수 문자열 형태로 제공됩니다.
        timestamp:
          type: integer
          description: |
            블록이 생성된 시간을 나타내는 필드입니다. UNIX 타임스탬프로 제공됩니다.
        parentHash:
          type: string
          description: |
            블록의 부모 블록 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로 제공됩니다.
        nonce:
          type: string
          description: >
            작업증명(PoW)에서 블록의 유효성을 증명하는 데 사용되는 값입니다. 지분증명(PoS)로 전환된 블록부터는
            0x0000000000000000을 반환합니다.
        stateRoot:
          type: string
          description: |
            블록 상태의 루트 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로 제공됩니다.
        receiptsRoot:
          type: string
          description: >
            블록에 포함된 트랜잭션들의 receipt의 루트 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열
            형태로 제공됩니다.
        transactionsRoot:
          type: string
          description: |
            블록에 포함된 트랜잭션들의 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로 제공됩니다.
        miner:
          type: string
          description: |
            블록을 생성한 채굴자의 주소를 나타내는 필드입니다. 0x로 시작하는 40자리의 16진수 문자열 형태로 제공됩니다.
        difficulty:
          type: string
          description: >
            블록 생성 난이도를 나타내는 필드입니다. 작업증명(PoW)에서는 난이도 값이 반환되며, 지분증명(PoS)로 전환된
            블록부터는 0을 반환합니다.
        totalDifficulty:
          type: string
          description: >
            블록 생성의 누적 난이도를 나타내는 필드로, 0번 블록부터 현재 블록까지의 난이도를 모두 더한 값을 반환합니다. 0x로
            시작하는 16진수 문자열 형태로 제공됩니다.
        mixHash:
          type: string
          description: >
            작업증명(PoW)에서 블록의 유효성을 증명하는 데 사용되는 값입니다. 0x로 시작하는 64자리 16진수 문자열 형태로
            제공됩니다.
        gasLimit:
          type: string
          description: >
            블록에 허용되는 최대 가스량을 나타내는 필드입니다. 블록에 포함된 모든 트랜잭션의 가스량을 합한 값은 이 값보다 작아야
            합니다. 0x로 시작하는 16진수 문자열 형태로 제공됩니다.
        gasUsed:
          type: string
          description: |
            블록에 포함된 모든 트랜잭션의 가스 사용량을 나타내는 필드입니다. 0x로 시작하는 16진수 문자열 형태로 제공됩니다.
        baseFeePerGas:
          type: string
          description: >
            블록 기본 가스 수수료를 나타내는 필드입니다. EIP-1559(London Hard fork)에서 도입된 변동적인 수수료
            모델의 일부입니다. 따라서 도입 이전 블록에서는 해당 필드가 제공되지 않습니다. 0x로 시작하는 16진수 문자열 형태로
            제공됩니다.
        blobGasUsed:
          type: string
          description: |
            블록에 포함된 블록 데이터의 가스 사용량을 나타내는 필드입니다. 0x로 시작하는 16진수 문자열 형태로 제공됩니다.
        size:
          type: string
          description: |
            블록의 크기를 나타내는 필드입니다. 바이트 단위로 제공됩니다. 0x로 시작하는 16진수 문자열 형태로 제공됩니다.
        logsBloom:
          type: string
          description: >
            블록에 포함된 모든 트랜잭션의 로그 블룸을 나타내는 필드입니다. 0x로 시작하는 512자리 16진수 문자열 형태로
            제공됩니다.
        extraData:
          type: string
          description: |
            블록에 포함된 추가 데이터를 나타내는 필드입니다. 0x로 시작하는 32자리 16진수 문자열 형태로 제공됩니다.
        sha3Uncles:
          type: string
          description: |
            블록에 포함된 모든 삼촌 블록의 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로 제공됩니다.
        transactionsCount:
          type: integer
          description: |
            블록에 포함된 트랜잭션의 수를 나타내는 필드입니다.
        transactions:
          type: array
          description: |
            블록에 포함된 트랜잭션의 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로 제공됩니다.
        withdrawalRoot:
          type: string
          description: >
            블록에 포함된 모든 출금 트랜잭션의 루트 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로
            제공됩니다.
        withdrawalsCount:
          type: integer
          description: |
            블록에 포함된 출금 트랜잭션의 수를 나타내는 필드입니다.
        withdrawalsRoot:
          type: string
          description: >
            블록에 포함된 모든 출금 트랜잭션의 루트 해시를 나타내는 필드입니다. 0x로 시작하는 64자리 16진수 문자열 형태로
            제공됩니다.
        withdrawals:
          type: array
          description: |
            검증자가 스테이킹한 자산을 출금한 목록을 나타내는 필드입니다.
          items:
            type: object
            required:
              - index
              - validatorIndex
              - address
              - amount
            properties:
              index:
                type: string
                description: >
                  출금 거래의 인덱스를 나타내는 필드입니다. 0부터 시작하는 정수로 제공됩니다. 10진수 문자열 형태로
                  제공됩니다.
              validatorIndex:
                type: string
                description: |
                  출금을 요청한 검증자의 인덱스를 나타내는 필드입니다. 10진수 문자열 형태로 제공됩니다.
              address:
                type: string
                description: >
                  출금된 Native Token을 받을 주소를 나타내는 필드입니다. 0x로 시작하는 40자리의 16진수 문자열
                  형태로 제공됩니다.
              amount:
                type: string
                description: |
                  출금한 수량을 나타내는 필드입니다. 10진수 문자열 형태로 제공됩니다.
        requestsHash:
          type: string
          description: >
            블록 헤더에 포함된 필드로, 해당 블록에 있는 모든 request들의 순서와 내용을 암호학적으로 커밋(commit)한
            해시값입니다. 이를 통해 전체 데이터를 다운로드하지 않아도 블록 내 request 목록의 무결성을 검증할 수 있습니다.
  responses:
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
            example:
              code: INVALID_PARAMETER
              message: >-
                Invalid parameter: { PARAMETER1_NAME = PARAMETER1_VALUE,
                PARAMETER2_NAME = PARAMETER2_VALUE, ... }
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              code: AUTHENTICATION_FAILED
              message: Authentication failed
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              code: PERMISSION_DENIED
              message: Permission denied
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              code: RESOURCE_NOT_FOUND
              message: >-
                Resource not found: { RESOURCE1_NAME = RESOURCE1_VALUE,
                RESOURCE2_NAME = RESOURCE2_VALUE, ... }
    '429':
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            example:
              code: TOO_MANY_REQUESTS
              message: Too many requests
