get:
  tags:
    - 주문
  summary: 주문 가능 정보
  description: 마켓별 주문 가능 정보를 확인한다.
  operationId: order-chance
  security:
    - authToken: []
  parameters:
    - name: market
      in: query
      required: true
      schema:
        type: string
        description: 마켓 ID
  responses:
    "200":
      description: Successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              bid_fee:
                type: string
                description: 매수 수수료 비율
              ask_fee:
                type: string
                description: 매도 수수료 비율
              market:
                $ref: ../components/schemas/Market.yaml
              bid_account:
                description: 매수 시 사용하는 화폐의 계좌 상태
                $ref: ../components/schemas/Accounts.yaml
              ask_account:
                description: 매도 시 사용하는 화폐의 계좌 상태
                $ref: ../components/schemas/Accounts.yaml
    "400":
      $ref: ../components/responses/BadRequest.yaml

  x-readme: # Readme Extension 적는 부분
    explorer-enabled: false # try it 버튼 활성(true)/비활성화(false)
    samples-languages: ["shell", "python", "java", "ruby"] # sample code 언어 선택
    # parameter-ordering: ["header", "path", "query", "cookie", "body", "form"] # 파라미터 순서 지정
    code-samples:
      - language: shell
        name: CURL
        code: |
          curl --request get \
            --url 'https://data.apiexample.com/api/example/batch_query/json?format=json' \
