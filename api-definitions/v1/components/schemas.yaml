components:
  schemas:
    Account:
      type: object
      properties:
        currency:
          type: string
          description: "현재 보유 중인 암호화폐 명"
        balance:
          type: string
          description: "주문 가능 금액 또는 수량. currency가 원화(KRW)인 경우 금액을, 암호화폐인 경우 수량을 의미합니다."
        locked:
          type: string
          description: "주문 대기 혹은 출금 등의 이유로 사용이 불가능한 금액 또는 수량"
        avg_buy_price:
          type: string
          description: "매수평균가"
        avg_buy_price_modified:
          type: boolean
          description: "매수평균가 수정 여부"
        unit_currency:
          type: string
          description: "평단가 기준 화폐"
