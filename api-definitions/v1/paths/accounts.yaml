/accounts:
  get:
    summary: "전체 계좌 조회"
    description: "내가 보유한 자산 리스트를 보여줍니다."
    operationId: getAccounts
    security:
      - BearerAuth: []
    responses:
      "200":
        description: "성공"
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Account"
      "401":
        $ref: "#/components/responses/Unauthorized"
