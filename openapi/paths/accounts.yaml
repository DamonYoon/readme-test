get:
  tags:
    - 자산 # 그룹 페이지 이름
  summary: 자산 조회 # API 페이지 이름
  description: 사용자가 보유한 자산 리스트를 조회합니다. # API 설명 (git sync시 excerpt에 해당하는 부분)
  operationId: accounts # 페이지 url endpoint
  security:
    - authToken: []
  # parameters:
  #   - name: Authorization
  #     in: header
  #     required: true
  #     schema:
  #       type: string
  #     description: 입력한 파라미터에 맞는 JWT 입력
  responses:
    "200":
      description: Successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Accounts.yaml
    "400":
      $ref: ../components/responses/BadRequest.yaml
  x-readme: # Readme Extension 적는 부분
    explorer-enabled: false # try it 버튼 활성(true)/비활성화(false)
    samples-languages: ["shell", "python", "java", "ruby"] # sample code 언어 선택
    # parameter-ordering: ["header", "path", "query", "cookie", "body", "form"] # 파라미터 순서 지정
    code-samples:
      - language: cURL
        name: CURL
        code: |
          curl --request get \
            --url 'https://data.apiexample.com/api/example/batch_query/json?format=json' \
            --header 'content-type: application/octet-stream: ' \
            --data '{}'
